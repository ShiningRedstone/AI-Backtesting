[project]
name = "edgelab"
version = "0.1.0"
description = "Research engine for testing whether a trading edge exists, under realistic costs and prop-firm constraints"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "pyyaml>=6.0", "scipy>=1.10"]

[project.optional-dependencies]
store = ["duckdb>=1.0"]
fast = ["numba>=0.60"]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["edgelab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
edgelab = "edgelab.cli:main"
