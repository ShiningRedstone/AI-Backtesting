# Contract specifications. point_value (contract multiplier) is derived as tick_value / tick_size;
# if you also state point_value it must agree or loading fails.
# Futures specs are standard CME specs; VERIFY against the exchange before live use.
instruments:
  NQ:  {exchange: CME,   tick_size: 0.25, tick_value: 5.00,  point_value: 20,   calendar: CME_EQUITY,
        description: "E-mini Nasdaq-100", contract_months: HMUZ, roll_methodology: "volume roll ~8 days pre-expiry (configurable)"}
  MNQ: {exchange: CME,   tick_size: 0.25, tick_value: 0.50,  point_value: 2,    calendar: CME_EQUITY,
        description: "Micro E-mini Nasdaq-100", contract_months: HMUZ}
  ES:  {exchange: CME,   tick_size: 0.25, tick_value: 12.50, point_value: 50,   calendar: CME_EQUITY,
        description: "E-mini S&P 500", contract_months: HMUZ}
  MES: {exchange: CME,   tick_size: 0.25, tick_value: 1.25,  point_value: 5,    calendar: CME_EQUITY,
        description: "Micro E-mini S&P 500", contract_months: HMUZ}
  YM:  {exchange: CBOT,  tick_size: 1.0,  tick_value: 5.00,  point_value: 5,    calendar: CME_EQUITY,
        description: "E-mini Dow", contract_months: HMUZ}
  RTY: {exchange: CME,   tick_size: 0.10, tick_value: 5.00,  point_value: 50,   calendar: CME_EQUITY,
        description: "E-mini Russell 2000", contract_months: HMUZ}
  CL:  {exchange: NYMEX, tick_size: 0.01, tick_value: 10.00, point_value: 1000, calendar: CME_GLOBEX_COMMODITY,
        description: "WTI Crude Oil", contract_months: all}
  GC:  {exchange: COMEX, tick_size: 0.10, tick_value: 10.00, point_value: 100,  calendar: CME_GLOBEX_COMMODITY,
        description: "Gold", contract_months: GJMQVZ}
  # ---- CFDs (Phase 2) -------------------------------------------------------------------
  # CFD contract specs are BROKER-SPECIFIC. Convention used here: 1 size unit = 1 currency
  # unit per index point (point_value 1), priced on a 0.01 grid. Map broker lots to units
  # in your broker profile. The different Nasdaq-100 CFD symbols are separate instruments:
  # some track the cash index, some the futures price (basis!) - never merged.
  NAS100_CFD: {exchange: OTC, asset_class: cfd, tick_size: 0.01, tick_value: 0.01, point_value: 1,
               min_size: 0.01, size_step: 0.01, underlying: NDX, calendar: CME_EQUITY,
               description: "Nasdaq-100 CFD (broker-specific spec; verify)"}
  US100_CFD:  {exchange: OTC, asset_class: cfd, tick_size: 0.01, tick_value: 0.01, point_value: 1,
               min_size: 0.01, size_step: 0.01, underlying: NDX, calendar: CME_EQUITY,
               description: "US Tech 100 CFD (broker-specific spec; verify)"}
  NQ_CFD:     {exchange: OTC, asset_class: cfd, tick_size: 0.01, tick_value: 0.01, point_value: 1,
               min_size: 0.01, size_step: 0.01, underlying: NDX, calendar: CME_EQUITY,
               description: "CFD referencing Nasdaq-100 futures (broker-specific; verify)"}
  # ---- HistData research proxy (not a tradable contract) --------------------------------
  # HistData NSXUSD M1 (BID prices, no volume). Raw prices sit on a 0.001 grid, so it cannot
  # share NAS100_CFD's 0.01 tick. tick_value/point_value follow the CFD unit convention above
  # (1 unit = 1 currency unit per index point); they are NOT broker figures. Costs ship
  # unconfigured (configs/costs.yaml). Default calendar = regime R2; import 2017-2018 files
  # with --calendar HISTDATA_NSX_R1. Evidence and open questions: DATA_IMPORT.md "HistData NSXUSD".
  NAS100_HISTDATA: {exchange: OTC, asset_class: cfd, tick_size: 0.001, tick_value: 0.001, point_value: 1,
                    min_size: 0.01, size_step: 0.01, underlying: NDX, calendar: HISTDATA_NSX_R2,
                    research_proxy: true, price_source: "HistData NSXUSD M1, BID",
                    description: "HistData NSXUSD Nasdaq-100 quote - research proxy, not a live tradable contract"}
  # ---- Dukascopy USATECH.IDX/USD (Phase 9 primary research source) ---------------------------
  # Identity USER-SPECIFIED from the user's download code (dukascopy-python 4.0.1):
  #   dukascopy_python.fetch(INSTRUMENT_IDX_AMERICA_E_NQ_100, INTERVAL_MIN_1, OFFER_SIDE_BID, START, END)
  # Verified in the library source: INSTRUMENT_IDX_AMERICA_E_NQ_100 = "E_NQ-100" (the feed code sent to
  # Dukascopy's freeserv chart/json3 feed), OFFER_SIDE_BID = "B", timestamps = epoch ms -> UTC.
  # User-specified (not verifiable offline here): E_NQ-100 is Dukascopy's USA 100 Technical Index,
  # platform symbol USATECH.IDX/USD, a Dukascopy index CFD - NOT CME NQ futures.
  # Economics: NO broker or exchange contract figures are known. tick/point/size values below are
  # RESEARCH UNITS (1 unit = 1 per index point, 0.001 price grid), not CME NQ ($20/pt) and not
  # Dukascopy's contract size. Costs: configs/costs.yaml NQ_DUKASCOPY (unconfigured -> research refused).
  # Calendar: DUKASCOPY_USATECH_OBSERVED (18:00 -> 16:15 New York) is the schedule OBSERVED in the real
  # file's inspection. It stays provisional_unverified (research refused) until the inspector has been
  # re-run under it on the real file and the 14 whole missing trading days are resolved or accepted
  # (DATA_IMPORT.md).
  NQ_DUKASCOPY: {exchange: OTC, asset_class: cfd, tick_size: 0.001, tick_value: 0.001,
                 point_value: 1, min_size: 0.01, size_step: 0.01, underlying: NDX,
                 calendar: DUKASCOPY_USATECH_OBSERVED, calendar_status: provisional_unverified,
                 calendar_observations: "real file sha256 d92f25fc...c1d9: Sun first bar 18:00 NY, Fri last bar 16:14 NY, 16:15-18:00 NY empty, no Saturday bars; holidays unresolved (14 whole missing trading days)",
                 research_proxy: true, identity_status: user_specified,
                 source_provider: DUKASCOPY, source_symbol: "USATECH.IDX/USD",
                 source_feed_code: "E_NQ-100", source_instrument_constant: INSTRUMENT_IDX_AMERICA_E_NQ_100,
                 source_description: "Dukascopy USA 100 Technical Index (Nasdaq-100-related index CFD)",
                 price_basis: bid, source_interval: 1m,
                 volume_semantics: "Dukascopy source volume (provider-defined); NOT CME exchange-traded volume",
                 economics: research_units,
                 identity_evidence: "user download code: dukascopy_python.fetch(INSTRUMENT_IDX_AMERICA_E_NQ_100 (= 'E_NQ-100' in dukascopy-python 4.0.1), INTERVAL_MIN_1, OFFER_SIDE_BID); symbol USATECH.IDX/USD and asset class stated by the user",
                 required_metadata: [source_symbol, asset_class, price_basis, tick_size, point_value,
                                     min_size, size_step],
                 price_source: "Dukascopy USATECH.IDX/USD (feed E_NQ-100), 1m candles, BID side, UTC",
                 description: "Dukascopy USATECH.IDX/USD BID - index CFD research proxy; NOT CME NQ; research units only"}
