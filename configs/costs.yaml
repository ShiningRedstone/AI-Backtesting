# Transaction cost ASSUMPTIONS. Replace with your broker / prop firm's actual schedule.
# All $ amounts are per contract per SIDE. Slippage is adverse ticks per fill.
costs:
  default:
    commission_per_side: 0.00
    fees_per_side: 0.00
    slippage_ticks_market: 1
    slippage_ticks_stop: 1
    slippage_ticks_limit: 0
    spread_points: 0.0
  symbols:
    NQ:  {commission_per_side: 1.50, fees_per_side: 0.70}    # ~$4.40 round trip + slippage (assumed)
    ES:  {commission_per_side: 1.50, fees_per_side: 0.70}
    MNQ: {commission_per_side: 0.50, fees_per_side: 0.25}
    MES: {commission_per_side: 0.50, fees_per_side: 0.25}
    YM:  {commission_per_side: 1.50, fees_per_side: 0.70}
    RTY: {commission_per_side: 1.50, fees_per_side: 0.70}
    CL:  {commission_per_side: 1.50, fees_per_side: 0.80}
    GC:  {commission_per_side: 1.50, fees_per_side: 0.80}
    # ---- CFDs: deliberately UNCONFIGURED. The engine refuses to run with these until you
    # enter your broker's real numbers (no broker figures are invented here). Either set a
    # fixed spread (spread_points) or use the dataset's own spread column (spread_source: dataset).
    # Per-provider overrides live under `providers:` so two feeds of the same symbol can carry
    # different cost assumptions. Example (fill in YOUR numbers, then set status):
    #   NAS100_CFD:
    #     providers:
    #       MYBROKER:
    #         status: broker_verified          # or: assumed
    #         commission_per_side: <$ per unit per side>
    #         slippage_unit: points
    #         slippage_ticks_market: <points>
    #         slippage_ticks_stop: <points>
    #         spread_source: dataset           # or fixed + spread_points: <points>
    #         financing_mode: annual_rate      # overnight holding cost, if you hold overnight
    #         financing_long_rate: <annual rate, e.g. 0.0725>
    #         financing_short_rate: <annual rate>
    #         triple_rollover_weekday: <0-6>
    NAS100_CFD: &cfd_unconfigured
      status: unconfigured
      notes: "CFD costs are broker-specific; none are assumed"
      slippage_unit: points
      commission_per_side: null
      slippage_ticks_market: null
      slippage_ticks_stop: null
      spread_points: null
      providers: {}
    US100_CFD: *cfd_unconfigured
    NQ_CFD: *cfd_unconfigured
    # HistData research proxy. Symbol level stays UNCONFIGURED (any other provider is refused);
    # only the HISTDATA feed gets the approved MNQ-equivalent research ASSUMPTIONS below.
    NAS100_HISTDATA:
      status: unconfigured
      notes: "research proxy; only providers.HISTDATA carries assumed MNQ-equivalent costs"
      slippage_unit: points
      commission_per_side: null
      slippage_ticks_market: null
      slippage_ticks_stop: null
      spread_points: null
      providers:
        HISTDATA:
          status: assumed                 # research assumption, NOT broker-verified
          notes: >-
            HistData NSXUSD BID prices are a research proxy (not CME NQ/MNQ prices). Costs are
            MNQ-equivalent research ASSUMPTIONS, not any broker's actual costs: 1 research unit =
            $1/index point, 1 MNQ = 2 units; $1.00 per MNQ per side commission+fees = $0.50 per
            unit per side; spread 0.50 points = 2 MNQ ticks; slippage 0.25 points = 1 MNQ tick
            on market and stop fills. Financing none under the MNQ/futures concept.
          commission_per_side: 0.50       # $ per research unit per side (commission + fees)
          fees_per_side: 0
          slippage_unit: points
          slippage_ticks_market: 0.25     # index points
          slippage_ticks_stop: 0.25
          slippage_ticks_limit: 0
          spread_source: fixed
          spread_points: 0.50             # full spread in index points, charged once per round trip
          financing_mode: none
    # Dukascopy USATECH.IDX/USD (feed E_NQ-100, BID; Phase 9): its OWN profile. HistData's assumed costs are never
    # reused for it (a different feed has a different spread/price side). Ships UNCONFIGURED:
    # the dataset imports, but every backtest is refused until you enter real numbers here
    # (commission/fees per unit per side, spread, slippage, financing) with a status of
    # `assumed` or `broker_verified` and a rationale in `notes`.
    NQ_DUKASCOPY:
      status: unconfigured
      notes: "Dukascopy USATECH.IDX/USD; no costs are assumed (not HistData's, not CME NQ's)"
      slippage_unit: points
      commission_per_side: null
      slippage_ticks_market: null
      slippage_ticks_stop: null
      spread_points: null
      providers:
        DUKASCOPY:
          status: unconfigured
          notes: "shape of Dukascopy CFD pricing; every number is EMPTY until evidenced (DATA_IMPORT.md)"
          # Named research-cost scenario: REQUIRED before status can change. scenario = a name (e.g.
          # "dukascopy_tier_assumption_v1"); basis = your statement of the source of each number
          # (e.g. "current published tier X; not proof of the 2021-2026 rate"). Recorded on every run.
          scenario: null
          basis: null
          # Dukascopy publishes commission per USD 1 million traded (tiered by account/volume):
          commission_mode: notional
          commission_per_million: null     # USD per USD 1,000,000 notional per side - from YOUR tier
          fees_per_side: 0
          # Variable spread: charged from a per-bar spread series (ask_close - bid_close). The imported
          # BID-only datasets have none, so backtests on them refuse until an ASK series is imported.
          spread_source: dataset
          spread_points: null
          slippage_unit: points
          slippage_ticks_market: null
          slippage_ticks_stop: null
          # Overnight holding costs may apply but follow changing benchmark rates: charged nothing and
          # disclosed as NOT modelled (not "none").
          financing_mode: not_modeled
