  HISTDATA_NSXUSD_2019:
    description: >-
      HistData NSXUSD M1 2019 (read as America/New_York, calendar HISTDATA_NSX_R2): extra
      17:00-17:59 NY bars on Sun-Thu evenings of the weeks when US DST is in effect and EU DST is
      not (2019-03-10..03-28 and 2019-10-27..10-31). Located by the local outside-session trace
