# Data validation thresholds and exchange session calendars.
validation:
  max_missing_bar_ratio_warn: 0.001     # > 0.1% expected bars missing -> WARN
  max_missing_bar_ratio_fail: 0.05      # > 5% -> FAIL (blocks strategies)
  max_outside_session_ratio_fail: 0.001 # bars when market is closed; DST/tz error signature
  spike_range_multiple: 25              # bar range > 25x median range -> WARN (bad tick?)
  tick_misaligned_ratio_warn: 0.0
  allow_nonpositive_prices: false       # set true for instruments that traded negative (CL 2020)

sample_size:
  min_trades: 100        # below -> "LOW SAMPLE SIZE" label (not rejected, but flagged)
  preferred_trades: 500

# Calendars: a trading date D runs session_open (previous day if later than close) -> session_close on D.
# Holidays are NOT bundled (no exchange_calendars offline). Add closures / early closes here;
# unlisted holidays show up as MISSING_DAY warnings instead of passing silently.
calendars:
  CME_EQUITY:            # NQ, ES, YM, RTY, MNQ, MES: Sun 18:00 - Fri 17:00 ET, daily halt 17:00-18:00
    timezone: America/New_York
    session_open: "18:00"
    session_close: "17:00"
    trading_weekdays: [mon, tue, wed, thu, fri]
    holidays: []           # e.g. ["2024-12-25", "2025-01-01"]
    early_closes: {}       # e.g. {"2024-11-29": "13:15"}
  CME_GLOBEX_COMMODITY:  # CL, GC (same Globex hours)
    timezone: America/New_York
    session_open: "18:00"
    session_close: "17:00"
    trading_weekdays: [mon, tue, wed, thu, fri]
    holidays: []
    early_closes: {}
  # ---- Dukascopy USATECH.IDX/USD 1m (feed E_NQ-100, BID) - OBSERVED source schedule ------------
  # Measured by scripts/dukascopy_inspect.py on the user's real file (C:\NQ_DATA\nq_1min_5years.csv,
  # sha256 d92f25fc5df3f59ac5291e1d4631f59ca116f074d54710e278aabe699ba4c1d9, 1,709,068 rows,
  # 2021-09-28 22:00Z .. 2026-09-28 22:00Z): weekly first bar normally Sun 18:00 NY, last bar normally
  # Fri 16:14 NY, 16:15-18:00 NY essentially empty every day, no Saturday bars, NY offsets -5/-4.
  # Single-session model: trading date D = D-1 18:00 -> D 16:15 (New York,
  # DST-safe). Under the earlier CME-style 18:00-17:00 assumption, 58,680 of the 90,453 "missing" bars
  # were this recurring 16:15-17:00 closure (45 bars x 1,304 trading dates), not data loss.
  # Official regular hours (Dukascopy range-of-markets page for USATECH.IDX/USD, as supplied by the
  # user): summer Sun-Fri 22:00-20:15 GMT, winter 23:00-21:15 GMT, daily break 20:15-22:00 / 21:15-23:00
  # GMT = 18:00 -> 16:15 New York in both regimes when "summer" follows US DST; 0 outside-session bars
  # across 5 years (incl. the US/EU DST-mismatch weeks) supports that reading.
  # NOT established: holidays / early closes. The 14 whole missing trading days (2021-12-24, 2022-04-15,
  # 2022-12-26, 2023-01-02, 2023-07-04, 2023-12-25, 2024-01-01, 2024-03-29, 2024-12-25, 2025-01-01,
  # 2025-04-18, 2025-12-25, 2026-01-01, 2026-04-03) and the early-close-shaped gaps stay visible as
  # warnings until Dukascopy's Trading Breaks Calendar entries for those dates are recorded as evidence
  # (it could not be retrieved from the build environment). The instrument keeps calendar_status: provisional_unverified until
  # the inspector has been re-run under THIS calendar on the real file.
  DUKASCOPY_USATECH_OBSERVED:
    timezone: America/New_York
    session_open: "18:00"
    session_close: "16:15"
    trading_weekdays: [mon, tue, wed, thu, fri]
    holidays: []
    early_closes: {}
  FX_24_5:
    timezone: America/New_York
    session_open: "17:00"
    session_close: "17:00"
    trading_weekdays: [mon, tue, wed, thu, fri]
  CRYPTO_24_7:
    timezone: UTC
    session_open: "00:00"
    session_close: "24:00"
    trading_weekdays: [mon, tue, wed, thu, fri, sat, sun]

# ---- Audited source-quality exclusions (ADR-44). Opt-in per import: --source-exclusions NAME. ----
# Windows are half-open [start, end) bar-open times, quoted, with an explicit UTC offset. A set is
# refused if a window matches no bar or contains ANY bar inside the import calendar's session.
source_exclusions: {}
