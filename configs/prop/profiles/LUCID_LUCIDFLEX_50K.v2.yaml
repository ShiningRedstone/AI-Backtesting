basis:
  status: user_specified
  specified_on: '2026-09-30'
  source:
    id: USER_CANONICAL_DEFAULTS_2026_09_30
    kind: user_specified
    title: Canonical default prop rule profiles supplied by the user in the EdgeLab task of 2026-09-30
    provided_on: '2026-09-30'
    note: Values as stated by the user. NOT independently verified against provider documentation by EdgeLab.
  modelling_choices:
  - path: trading_day.reset_time
    value: '18:00'
    note: trading day = CME session ending 18:00 America/New_York (not in the supplied rules)
  - path: '*.drawdown.breach_comparison'
    value: at_or_below
    note: touching the floor counts as a breach
  - path: '*.drawdown.enforcement'
    value: intratrade_bound
    note: '''enforced in real time'': the worst equity inside each trade (balance - MAE, bar resolution) is compared with
      the floor; this is a conservative bound, not a tick path'
  - path: '*.dll.detection'
    value: closed_trade
    note: a DLL is detected on closed-trade day P&L (bar-resolution limitation)
  - path: funded.carry_evaluation_profit
    value: false
    note: the funded account starts at its own starting_balance
  - path: payout.request
    value: max_allowed
    note: each payout requests the maximum permitted amount
  - path: payout.after_payout_drawdown
    value: unchanged
    note: a payout does not move the drawdown floor
  - path: evaluation.minimum_trading_days
    value: null
    note: 'no minimum was supplied for LucidFlex: none applied'
  - path: evaluation.drawdown.lock_trigger_offset
    value: 2100
    note: the supplied 52,100 / 50,100 lock is applied to the evaluation too
  - path: payout.formula.profit_basis
    value: balance_above_stage_start
    note: '''50% of profit'' = 50% of balance above the funded start'
  - path: payout.buffer_offset
    value: 0
    note: 'payout_buffer = 0: a payout never takes the balance below the funded start'
  sources: []
  evidence: {}
