  modelling_choices:
  - path: trading_day.reset_time
    value: '18:00'
    note: trading day = CME session ending 18:00 America/New_York (not in the supplied rules)
  - path: '*.drawdown.breach_comparison'
    value: at_or_below
    note: touching the floor counts as a breach
  - path: '*.drawdown.enforcement'
    value: intratrade_bound
    note: '''enforced in real time'': the worst equity inside each trade (balance - MAE, bar resolution) is compared with
      the floor; this is a conservative bound, not a tick path'
  - path: '*.dll.detection'
    value: closed_trade
    note: a DLL is detected on closed-trade day P&L (bar-resolution limitation)
  - path: funded.carry_evaluation_profit
    value: false
    note: the funded account starts at its own starting_balance
  - path: payout.request
    value: max_allowed
    note: each payout requests the maximum permitted amount
  - path: payout.after_payout_drawdown
    value: unchanged
    note: a payout does not move the drawdown floor
  - path: '*.drawdown.lock_trigger_offset'
    value: 2100
    note: the Tradeify EOD drawdown lock level was not supplied; EdgeLab uses the same structure as the supplied LucidFlex
      model (lock when the highest EOD balance reaches start + 2,100; locked floor start + 100). Without a lock the floor
      would trail every payout. CONFIRM or change lock_trigger_offset / locked_floor_offset
  - path: funded.scaling.persist
    value: false
    note: tiers are recalculated each session end from balance above start
  - path: funded.dll.behavior
    value: soft_breach
    note: 'the Select Daily DLL hard/soft behaviour was not supplied: soft (stop for the day) is the default here; set hard_breach
      to fail the account instead'
  - path: payout.buffer_offset
    value: 2100
    note: a payout never takes the balance below starting_balance + 2,100
  - path: payout.cap.table
    value: post-2026-09-01 only
    note: 'earlier purchase-date caps were not supplied: refused'
